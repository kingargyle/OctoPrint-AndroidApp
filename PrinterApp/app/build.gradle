plugins {
    id("com.android.application")
    id("kotlin-android")
}

android {
    compileSdkVersion 35
    namespace "android.app.printerapp"
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "android.app.printerapp"
        minSdkVersion 29
        targetSdkVersion 35
        versionName 1.0 + ";" + computeVersionName()
        versionCode System.getenv("BUILD_NUMBER") as Integer ?: 1

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    lintOptions {
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11" // Must match the version in compileOptions
    }
}

def computeVersionName() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'log', '-n', '1', '--pretty=format:%h%x09%ad'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    implementation files('libs/autobahn-0.5.0.jar')
    implementation files('libs/devsmartlib.jar')
    implementation files('libs/jmdns.jar')
//    implementation files('libs/nineoldandroids-2.4.0.jar')
    implementation files('libs/core-1.51.0.0.jar')
    //UI libraries
    implementation project(':horizontallistlibrary')
    implementation 'uk.co.androidalliance:edgeeffectoverride:1.0.2' //Scroll mode effect
    //Material design libraries
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.core:core:1.15.0"
    implementation "com.google.android.material:material:1.12.0"
//    implementation 'com.github.navasmdc:MaterialDesign:1.5'
    implementation 'com.github.fengdai:alertdialogpro-theme-material:0.2.1'
    implementation project(':materialdesignlibrary')
    implementation 'com.afollestad.material-dialogs:core:3.3.0' //Material design dialogs
    implementation "com.afollestad.material-dialogs:files:3.3.0"
    implementation 'com.pnikosis:materialish-progress:1.4'
    implementation 'com.rengwuxian.materialedittext:library:1.8.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.httpcomponents:httpclient-android:4.3.5'
    implementation files('libs/android-async-http-1.4.6.jar')
}
